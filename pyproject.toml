[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abkit"
version = "0.2.0"
description = "Bayesian experimentation and uplift modelling: hierarchical PyMC models, multi-offer uplift, trust checks, power analysis and Airflow pipelines."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Cyrus (Sirous) Namjoo" }, { name = "Brandon Armstrong" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "pymc>=6.0",
    "arviz>=1.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.50", "plotly>=5.18"]
fast = ["numpyro>=0.15"]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "jupyter", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-third-party = ["airflow"]
