[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abkit"
version = "0.1.0"
description = "A trustworthy A/B test analysis toolkit: trust checks, frequentist + Bayesian inference, power, segments and uplift modelling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cyrus (Sirous) Namjoo" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
app = ["streamlit>=1.50", "plotly>=5.18"]
dev = ["pytest>=8", "jupyter", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
